seed: 123
deterministic: false
experiment:
  name: transformer_no_pos
  group: ablation
  reference: transformer
  changed_factor: 'positional encoding: learned -> none'
  hypothesis: Self-attention is permutation-equivariant; without positional encoding
    the CLS output only sees an unordered set of patches, so macro-F1 is expected
    to drop.
data:
  name: fashion_mnist
  raw_root: data/raw
  split_dir: data/splits
  split_seed: 42
  val_fraction: 0.1
  num_workers: 2
  augment:
    random_crop_padding: 2
    hflip: true
train:
  epochs: 40
  batch_size: 128
  eval_batch_size: 512
  label_smoothing: 0.0
  grad_clip: 1.0
  amp: true
  early_stopping_patience: 10
  checkpoint_metric: val_macro_f1
  show_progress: true
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.05
  momentum: 0.9
scheduler:
  name: cosine
  warmup_epochs: 3
  min_lr_ratio: 0.01
eval:
  bootstrap_samples: 1000
  n_examples: 25
  inference:
    batch_size: 256
    warmup_iters: 10
    timed_iters: 50
    latency_samples: 200
    amp: false
output:
  root: outputs/runs
model:
  name: transformer
  sequence_mode: patches
  patch_size: 4
  d_model: 96
  num_heads: 4
  depth: 4
  mlp_ratio: 2.0
  dropout: 0.1
  attn_dropout: 0.0
  pos_encoding: none
  pooling: cls
run:
  run_id: fashion_mnist-transformer_no_pos-s123-20260922-202826
  config_file: /home/benjamin/Documents/26/DL/CO3133-A1-draft/configs/fashion_mnist/ablations/transformer_no_pos.yaml
  overrides: []
  started_at: 2026-09-22T20:28:26+0700
