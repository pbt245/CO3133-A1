base: _base.yaml

experiment:
  name: transformer

model:
  name: transformer
  sequence_mode: patches   # 4x4 patches -> 64 tokens of dim 48 (+1 CLS token)
  patch_size: 4
  d_model: 128
  num_heads: 4
  depth: 6
  mlp_ratio: 2.0
  dropout: 0.1
  attn_dropout: 0.0
  pos_encoding: learned
  pooling: cls

optim:
  lr: 0.001
  weight_decay: 0.05

scheduler:
  warmup_epochs: 5
