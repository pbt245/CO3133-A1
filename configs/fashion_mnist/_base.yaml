# Fashion-MNIST: primary dataset for the main comparison.
# Official split: 60,000 train / 10,000 test.
# Our split: 54,000 train / 6,000 val (stratified, split_seed=42) / 10,000 official test.
base: ../common.yaml

data:
  name: fashion_mnist
  augment:
    random_crop_padding: 2   # random shift of up to 2 px
    hflip: true              # garments/shoes are left-right symmetric enough

train:
  epochs: 40
  early_stopping_patience: 10
